<text class="lbl" x="470" y="412">benchmarks only</text>
<!-- v1.9.70 (finding 335): rule grades NEVER enter the judging layer (D91 — descriptive only, enforced
     by DescriptiveOnlyGuardTests). They flow to the researcher's evidence instead: the D91/D113
     evidence-prior seam, placebo-able for the paper control. -->
<path d="M560 380 L572 380 L572 822 L300 822 L300 814" class="arr" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text class="lbl" x="490" y="722" text-anchor="middle">rule grades feed the</text>
