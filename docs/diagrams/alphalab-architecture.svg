  text  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th   { font-size: 13px; font-weight: 600; }
  .ts   { font-size: 11px; }
  .lbl  { font-size: 11px; fill: #73726c; }
  .arr  { stroke: #73726c; stroke-width: 1.4; fill: none; }
  .gray rect   { fill: #EEEEEE; stroke: #7A7A7A; stroke-width: 1; }
  .gray text   { fill: #2b2b2b; }
  .green rect  { fill: #E8F5E9; stroke: #2E7D46; stroke-width: 1; }
  .green text  { fill: #14351f; }
  .blue rect   { fill: #E7F0FB; stroke: #1F5FA6; stroke-width: 1; }
  .blue text   { fill: #0f2f52; }
  .teal rect   { fill: #E2F5F1; stroke: #0F6E56; stroke-width: 1; }
  .teal text   { fill: #0a3b30; }
  .purple rect { fill: #F3EEFB; stroke: #6A4FB0; stroke-width: 1; }
  .purple text { fill: #301d5c; }
  .amber rect  { fill: #FFF4E5; stroke: #C77700; stroke-width: 1; }
  .amber text  { fill: #5c3800; }
  .grp         { fill: none; stroke-dasharray: 4 3; stroke-width: 1; }
  .grptxt      { fill: #3d3d3a; }
</style>
